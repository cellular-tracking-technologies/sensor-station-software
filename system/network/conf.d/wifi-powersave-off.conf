# Disable WiFi power-save for all NetworkManager connections.
#
# The USB WiFi adapters (e.g. RTL8811CU / rtl8821cu) drop into power-save when
# idle and stop answering inbound traffic — including ARP — so a station on WiFi
# becomes unreachable until outbound activity (a check-in) or a reboot wakes it.
# Observed in the field as "the WiFi station is invisible until I plug a dongle
# in or reboot it."
#
# powersave = 2 (disable) keeps wlan0 responsive. This is a connection DEFAULT,
# so it applies to every connection that doesn't set its own
# 802-11-wireless.powersave — including profiles created on the fly by the
# load-WiFi-credentials-from-USB flow.
[connection]
wifi.powersave = 2
