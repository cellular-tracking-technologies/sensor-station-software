# Build a distributable sensor-station eMMC image (Raspberry Pi Compute Module,
# flashed via rpiboot over USB — there is no SD card) in CI, incrementally.
#
# Mirrors the manual process (loop-mount the last image, update the software in
# the mount, shrink, upload to S3), but pguyot/arm-runner-action does the
# loop-mount + qemu-arm binfmt so update-station.sh runs INSIDE the image's ARM
# rootfs.
#
# It runs in CTT_BUILD_MODE (see update-station.sh), which differs from a field
# station in exactly three ways the build requires:
#   - native binaries install by checksum+pin (install-native's run-it-to-check
#     `--version` smoke test can't work under emulation), so the pinned binaries
#     actually get baked in;
#   - a failed deploy hook is FATAL and fails the build (no more green-but-broken
#     images), enforced by `|| exit 1` on the update-station call below;
#   - station-runtime steps are skipped (LCD splash, and the image-OTA
#     checkin/upload session — a build must not impersonate a station).
#
# What still runs: git pull sensor-station-software + sensorgnome (public HTTPS),
# npm install if package.json changed, and the post-merge deploy hooks
# (install-native / install-systemd / install-udev). `systemctl restart` calls are
# harmless no-ops here (no systemd in the chroot); the image starts services fresh
# on first boot.
#
# The base image is assumed ALREADY sanitized (prepare-image.sh was run when the
# base was generated) and ALREADY checked out on the release branch — this job
# only layers code + binary updates onto it, so there is no re-sanitize step.
name: build-image

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'      # release tags (npm version -> v2.1.0) auto-build the image
  workflow_dispatch:
    inputs:
      base_image:
        description: "Base image key under images/lts_26_07/. Blank / tag-push -> sensor-station.latest.img.xz"
        required: false
        default: "sensor-station.latest.img.xz"

# Serialize image builds so a tag-push and a manual run can't race on the same S3 keys.
concurrency:
  group: build-image
  cancel-in-progress: false

permissions:
  contents: write          # create the GitHub pre-release on tag builds
  id-token: write          # OIDC -> AWS; no long-lived keys in the repo

env:
  # lts_26_07 platform generation, isolated under images/lts_26_07/ so it never
  # touches the current public LTS at images/ root (that stays as-is until we
  # deliberately cut over). Base is read from, and outputs written to, here.
  S3_PREFIX: s3://media.celltracktech.com/sensor-station/images/lts_26_07
  PUBLIC_PREFIX: https://media.celltracktech.com/sensor-station/images/lts_26_07
  AWS_REGION: us-east-1    # adjust to the bucket's region

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # A <6GB image expands (apt/npm headroom) then shrinks — a ~15-20GB peak.
      # Reclaim the runner's preinstalled toolchains to clear well past that.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IMAGE_BUILD_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch base image
        run: |
          # Download OUTSIDE the workspace. arm-runner copies $GITHUB_WORKSPACE into
          # the image at /<basename>, so a base.img.xz left in the workspace gets
          # baked into the built image (~875MB of self-nested bloat). RUNNER_TEMP is
          # not copied. Base resolves under images/lts_26_07/ (see S3_PREFIX).
          aws s3 cp "$S3_PREFIX/${{ inputs.base_image || 'sensor-station.latest.img.xz' }}" "$RUNNER_TEMP/base.img.xz"

      - name: Update software inside the image
        uses: pguyot/arm-runner-action@v2
        id: build
        with:
          # Local base image as a file:// URL with an absolute path, in RUNNER_TEMP
          # (not the copied workspace). arm-runner decompresses the .xz itself.
          base_image: file://${{ runner.temp }}/base.img.xz
          image_additional_mb: 600      # headroom for npm install / fetched binaries
          # optimize_image only zeroes free space; it does NOT truncate the partition, so
          # the .img stayed padded to full size (~6 GiB). That compresses away in xz but the
          # imager writes it in full (~3x slower to burn). We shrink explicitly below instead.
          optimize_image: false
          commands: |
            # In the chroot, HOME is inherited as the runner's /home/runner (absent
            # in the image), so update-station.sh can't write its safe.directory
            # global config and git refuses the ctt-owned checkout as root ("dubious
            # ownership"). Point HOME at the image's /root and pre-trust all repos.
            export HOME=/root
            git config --global --add safe.directory '*'
            # CTT_BUILD_MODE: install natives by checksum+pin (can't exec armhf under
            # emulation), run deploy hooks without sudo so the flag survives + FATAL on
            # failure, and skip station-runtime steps (LCD, image-OTA checkin/upload).
            # `|| exit 1` fails the image build loudly instead of publishing a
            # green-but-broken image. See update-station.sh.
            CTT_BUILD_MODE=1 bash /usr/lib/ctt/sensor-station-software/system/scripts/update-station.sh || exit 1
            # Stamp the image build date: /etc/ctt/station-image should reflect when THIS
            # image was generated, not the frozen base-image cut date it inherits. update-
            # station.sh writes /etc/ctt/station-software (last software update) on every run
            # incl. OTA; the image stamp is distinct and set ONLY here, at image-build time.
            date -u +'%Y-%m-%d' > /etc/ctt/station-image
            # Reclaim rootfs space so PiShrink can reach the real minimum. OTA/npm/apt leave
            # caches, package lists, and logs behind that inflate the fs (and thus the burn
            # size). Safe: apt lists regenerate on `apt update`; logs/caches are recreated.
            apt-get clean || true
            rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*.deb || true
            command -v npm >/dev/null 2>&1 && npm cache clean --force || true
            find /var/log -type f -delete 2>/dev/null || true
            rm -rf /var/log/journal/* /tmp/* /var/tmp/* /root/.npm /root/.cache /home/*/.npm /home/*/.cache || true
            # Drop the buggy custom rc.local expand loop (base-image artifact: an rc.local
            # workaround with a recursion bug -- 'cp rc.local.bak rc.local && /etc/rc.local' --
            # looped forever instead of rebooting, so stations booted 96% full). Neutralize it.
            # Rootfs expansion is now ctt-firstboot-resize.service (deployed above by
            # update-station on the ROOT partition) -- fail-safe, NOT a PID-1 cmdline hook.
            printf '%s\n' '#!/bin/sh' 'exit 0' > /etc/rc.local; chmod +x /etc/rc.local

      - name: Strip any PID-1 init_resize hook from cmdline (defensive)
        run: |
          # We deliberately do NOT use the stock init=/usr/lib/raspi-config/init_resize.sh cmdline
          # hook. It boots fine, but on the CTT image its reboot-based resize2fs_once fs-grow never
          # completes (leaves a full-size partition with a ~3.2 GB fs), and its extra reboot would
          # fight our one-pass expander. ctt-firstboot-resize.service (fail-safe, root partition) is
          # the sole owner, so strip any init_resize hook a base image carries (loop-mount p1).
          IMG="${{ steps.build.outputs.image }}"
          LOOP="$(sudo losetup -Pf --show "$IMG")"
          MNT="$(mktemp -d)"
          sudo mount "${LOOP}p1" "$MNT"
          sudo sed -i 's| init=/usr/lib/raspi-config/init_resize.sh||g' "$MNT/cmdline.txt" || true
          echo "cmdline.txt now: $(cat "$MNT/cmdline.txt")"
          sudo sync
          sudo umount "$MNT"
          sudo losetup -d "$LOOP"
          rmdir "$MNT"

      - name: Shrink image (PiShrink -s — truncate only; ctt-firstboot-resize owns first-boot expand)
        run: |
          # arm-runner's optimize_image does not truncate the image down to used size, so the
          # published .img was ~6 GiB (mostly zeroed free space: compresses away in xz, but the
          # imager writes it in full -> ~3x slower to burn, esp. over rpiboot's USB 2.0 link).
          # PiShrink shrinks the ext4 root to its minimum and truncates the .img. -s skips
          # PiShrink's OWN autoexpand -- ctt-firstboot-resize.service grows the rootfs to fill the
          # eMMC on first boot (fail-safe), matching the historical Ansible+PiShrink image sizes.
          curl -fsSL https://raw.githubusercontent.com/Drewsif/PiShrink/master/pishrink.sh -o pishrink.sh
          chmod +x pishrink.sh
          sudo ./pishrink.sh -s -v "${{ steps.build.outputs.image }}"

      - name: Compress + publish versioned image
        run: |
          # Single, consistent naming scheme: sensor-station-v<version>.img.xz, version
          # from package.json on the built ref (fetched raw so we don't check the repo
          # into the workspace — arm-runner would bake it into the image). Release (tag)
          # builds are IMMUTABLE (never overwrite a version); manual/dev builds get a
          # -dev.<sha> suffix so they can't collide with or masquerade as a release.
          VERSION="$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/package.json" | jq -r .version)"
          case "$VERSION" in ''|null) echo "could not read version from package.json"; exit 1;; esac
          if [ "${{ github.ref_type }}" = "tag" ]; then
            [ "v$VERSION" = "${{ github.ref_name }}" ] || { echo "::error::tag ${{ github.ref_name }} != package.json v$VERSION — bump/tag mismatch"; exit 1; }
            KEY="sensor-station-v${VERSION}.img.xz"
            if aws s3 ls "$S3_PREFIX/$KEY" >/dev/null 2>&1; then
              echo "::error::$KEY already exists — release images are immutable. Bump the version for a new release."
              exit 1
            fi
          else
            KEY="sensor-station-v${VERSION}-dev.$(echo "${{ github.sha }}" | cut -c1-7).img.xz"
          fi
          IMG="${KEY%.xz}"                        # sensor-station-v<version>[...].img
          mv "${{ steps.build.outputs.image }}" "$IMG"
          xz -T0 -v "$IMG"                        # -> $IMG.xz == $KEY
          sha256sum "$KEY" > "$KEY.sha256"
          cat "$KEY.sha256"
          # public-read so CloudFront (media.celltracktech.com) serves it for download.
          aws s3 cp --acl public-read "$KEY"        "$S3_PREFIX/$KEY"
          aws s3 cp --acl public-read "$KEY.sha256" "$S3_PREFIX/$KEY.sha256"
          echo "Published $S3_PREFIX/$KEY (+ .sha256)"
          echo "IMG_KEY=$KEY" >> "$GITHUB_ENV"
          echo "IMG_SHA=$(cut -d' ' -f1 "$KEY.sha256")" >> "$GITHUB_ENV"

      - name: Create GitHub pre-release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag build -> a GitHub pre-release with templated notes. The notes template and
          # this version's CHANGELOG.md section are fetched raw (the repo isn't checked out
          # here, to keep it out of the image). Idempotent (edits the release if re-run).
          TAG="${{ github.ref_name }}"; VERSION="${TAG#v}"
          URL="${PUBLIC_PREFIX}/${IMG_KEY}"
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          DATE="$(date -u +%Y-%m-%d)"
          RAW="https://raw.githubusercontent.com/${{ github.repository }}/${TAG}"
          curl -fsSL "$RAW/.github/release-notes-template.md" > "$RUNNER_TEMP/notes.md"
          # This version's CHANGELOG section: the "## [X.Y.Z]" body, up to the next "## [".
          curl -fsSL "$RAW/CHANGELOG.md" \
            | awk -v v="$VERSION" 'index($0,"## ["v"]")==1{f=1;next} f&&/^## \[/{exit} f{print}' \
            > "$RUNNER_TEMP/section.md"
          [ -s "$RUNNER_TEMP/section.md" ] || echo "_See CHANGELOG.md._" > "$RUNNER_TEMP/section.md"
          # Fill single-line placeholders, then splice the CHANGELOG section in.
          sed -i \
            -e "s|__VERSION__|${VERSION}|g"     -e "s|__IMG_KEY__|${IMG_KEY}|g" \
            -e "s|__URL__|${URL}|g"             -e "s|__IMG_SHA__|${IMG_SHA}|g" \
            -e "s|__REPO__|${{ github.repository }}|g" \
            -e "s|__SHORT_SHA__|${SHORT_SHA}|g" -e "s|__DATE__|${DATE}|g" \
            "$RUNNER_TEMP/notes.md"
          sed -i -e "/__CHANGELOG__/{r $RUNNER_TEMP/section.md" -e "d}" "$RUNNER_TEMP/notes.md"
          TITLE="SensorStation OS Image ${VERSION}"
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit   "$TAG" -R "${{ github.repository }}" --prerelease --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" -R "${{ github.repository }}" --prerelease --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          echo "pre-release $TAG ready -> $URL"
