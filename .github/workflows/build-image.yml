# Build a distributable sensor-station SD-card image in CI — incrementally.
#
# Mirrors the manual process (loop-mount the last image, update the software in
# the mount, shrink, upload to S3), but pguyot/arm-runner-action does the
# loop-mount + qemu-arm binfmt so update-station.sh runs INSIDE the image's ARM
# rootfs exactly as it does on a field station.
#
# What runs in the image (via update-station.sh):
#   - git pull sensor-station-software + sensorgnome  (public HTTPS, no creds)
#   - post-merge.sh hooks -> install-native fetches the pinned armhf binaries,
#     install-systemd / install-udev deploy units + rules
#   - npm install if package.json changed (runs under qemu — slow but correct)
# Its `systemctl restart` calls are harmless no-ops here (no systemd in the
# chroot) and don't abort the run (update-station.sh has no `set -e`); the image
# starts services fresh on first boot regardless.
#
# The base image is assumed ALREADY sanitized (prepare-image.sh was run when the
# base was generated) and ALREADY checked out on the release branch — this job
# only layers code + binary updates onto it, so there is no re-sanitize step.
name: build-image

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'      # release tags (npm version -> v2.1.0) auto-build the image
  workflow_dispatch:
    inputs:
      base_image:
        description: "Base image key to layer onto (images/ prefix). Blank / tag-push -> sensor-station.latest.img.xz"
        required: false
        default: "sensor-station.latest.img.xz"

# Serialize image builds so a tag-push and a manual run can't race on the same S3 keys.
concurrency:
  group: build-image
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write          # OIDC -> AWS; no long-lived keys in the repo

env:
  S3_PREFIX: s3://media.celltracktech.com/sensor-station/images
  AWS_REGION: us-east-1    # adjust to the bucket's region

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # A <6GB image expands (apt/npm headroom) then shrinks — a ~15-20GB peak.
      # Reclaim the runner's preinstalled toolchains to clear well past that.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IMAGE_BUILD_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch base image
        run: |
          # Download OUTSIDE the workspace. arm-runner copies $GITHUB_WORKSPACE into
          # the image at /<basename>, so a base.img.xz left in the workspace gets
          # baked into the built image (~875MB of self-nested bloat). RUNNER_TEMP is
          # not copied.
          aws s3 cp "$S3_PREFIX/${{ inputs.base_image || 'sensor-station.latest.img.xz' }}" "$RUNNER_TEMP/base.img.xz"

      - name: Update software inside the image
        uses: pguyot/arm-runner-action@v2
        id: build
        with:
          # Local base image as a file:// URL with an absolute path, in RUNNER_TEMP
          # (not the copied workspace). arm-runner decompresses the .xz itself.
          base_image: file://${{ runner.temp }}/base.img.xz
          image_additional_mb: 600      # headroom for npm install / fetched binaries
          optimize_image: true          # shrink (PiShrink-equivalent) on the way out
          commands: |
            # In the chroot, HOME is inherited as the runner's /home/runner (absent
            # in the image), so update-station.sh can't write its safe.directory
            # global config and git refuses the ctt-owned checkout as root ("dubious
            # ownership"). Point HOME at the image's /root and pre-trust all repos.
            export HOME=/root
            git config --global --add safe.directory '*'
            bash /usr/lib/ctt/sensor-station-software/system/scripts/update-station.sh

      - name: Compress + publish date-stamped image
        run: |
          NAME="sensor-station.$(date +%Y-%m-%d).img"
          mv "${{ steps.build.outputs.image }}" "$NAME"
          xz -T0 -v "$NAME"             # -> $NAME.xz (multi-threaded)
          sha256sum "$NAME.xz" > "$NAME.xz.sha256"   # integrity sidecar (mirrors native-release.yml)
          cat "$NAME.xz.sha256"
          # public-read so CloudFront (media.celltracktech.com) serves them for
          # open download — matches upload-image.sh's put-object-acl step.
          aws s3 cp --acl public-read "$NAME.xz" "$S3_PREFIX/$NAME.xz"
          aws s3 cp --acl public-read "$NAME.xz.sha256" "$S3_PREFIX/$NAME.xz.sha256"
          echo "Published $S3_PREFIX/$NAME.xz (+ .sha256)"
          echo "IMG_NAME=$NAME" >> "$GITHUB_ENV"   # hand the exact filename to the next step

      - name: Publish immutable versioned image (for GitHub Release / linking)
        run: |
          # A version-named copy that is NEVER overwritten — the immutable artifact a
          # GitHub Release / stable link can reference (the date-stamped key gets
          # overwritten by same-day rebuilds). Version comes from package.json on the
          # built ref, fetched raw so we do NOT check the repo into the workspace
          # (arm-runner would otherwise bake it into the image). Byte-identical to the
          # date-stamped image just published; we reuse its sha256 and only rename.
          VERSION="$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/package.json" | jq -r .version)"
          case "$VERSION" in ''|null) echo "could not read version from package.json"; exit 1;; esac
          VKEY="sensor-station-v${VERSION}.img.xz"
          if aws s3 ls "$S3_PREFIX/$VKEY" >/dev/null 2>&1; then
            echo "::warning::$VKEY already exists — the v$VERSION release image is immutable; not overwriting. Bump the version for a new release."
            exit 0
          fi
          aws s3 cp --acl public-read "${IMG_NAME}.xz" "$S3_PREFIX/$VKEY"
          printf '%s  %s\n' "$(cut -d' ' -f1 "${IMG_NAME}.xz.sha256")" "$VKEY" > "$VKEY.sha256"
          aws s3 cp --acl public-read "$VKEY.sha256" "$S3_PREFIX/$VKEY.sha256"
          echo "Published immutable $S3_PREFIX/$VKEY (+ .sha256)"
